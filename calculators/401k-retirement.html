<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>401(k) Retirement Calculator | LumoCalc</title>
  <meta name="description" content="Estimate your 401(k) balance at retirement based on current balance, salary, contribution percentage, employer match, and expected annual return." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://lumocalc.com/calculators/401k-retirement.html" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lumocalc.com/calculators/401k-retirement.html" />
  <meta property="og:site_name" content="LumoCalc" />
  <meta property="og:title" content="401(k) Retirement Calculator | LumoCalc" />
  <meta property="og:description" content="Estimate your 401(k) balance at retirement based on contributions, employer match, and growth." />
  <meta property="og:image" content="https://lumocalc.com/assets/LumoCalc%20Favicon.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="401(k) Retirement Calculator | LumoCalc" />
  <meta name="twitter:description" content="Estimate your 401(k) balance at retirement based on contributions, employer match, and growth." />

  <link rel="icon" href="../assets/LumoCalc%20Favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div id="site-header"></div>
<main class="container">
  <section class="hero">
    <h1 class="h1">401(k) / Retirement Calculator</h1>
    <p class="lede">Estimate your retirement balance using simple assumptions.</p>
  </section>

  <section class="card">
    <form class="form" id="form">
      <div class="row">
        <div class="field">
          <label>Current age</label>
          <input id="age" inputmode="decimal" placeholder="e.g., 35" />
        </div>
        <div class="field">
          <label>Retirement age</label>
          <input id="retire" inputmode="decimal" value="67" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Current 401(k) balance</label>
          <input id="balance" inputmode="decimal" placeholder="e.g., 45000" />
        </div>
        <div class="field">
          <label>Annual salary</label>
          <input id="salary" inputmode="decimal" placeholder="e.g., 70000" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Your contribution (%)</label>
          <input id="contrib" inputmode="decimal" value="6" />
        </div>
        <div class="field">
          <label>Employer match (%)</label>
          <input id="match" inputmode="decimal" value="3" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Estimated annual return (%)</label>
          <input id="return" inputmode="decimal" value="7" />
        </div>
      </div>

      <div class="row">
        <button class="btn btn--primary">Calculate</button>
        <button class="btn" type="button" id="reset">Reset</button>
      </div>

      <div id="err" class="error"></div>

      <div class="result" id="out" hidden>
        <strong id="total">—</strong>
        <div class="small" id="years"></div>
        <div class="small" id="notes"></div>
      </div>
    </form>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="../js/calc-401k.js"></script>
<script src="../js/includes.js"></script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "401(k) Retirement Calculator",
  "applicationCategory": "FinanceApplication",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "operatingSystem": "All",
  "url": "https://lumocalc.com/calculators/401k-retirement.html"
}
</script>
</body>
</html>
