<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Debt-to-Income (DTI) Calculator | LumoCalc</title>
  <meta name="description" content="Calculate your debt-to-income ratio (DTI) and see how lenders view your finances. Find out if your DTI is excellent, acceptable, or risky." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://lumocalc.com/calculators/debt-to-income.html" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lumocalc.com/calculators/debt-to-income.html" />
  <meta property="og:site_name" content="LumoCalc" />
  <meta property="og:title" content="Debt-to-Income (DTI) Calculator | LumoCalc" />
  <meta property="og:description" content="Calculate your DTI ratio and see how lenders rate your debt compared to your income." />
  <meta property="og:image" content="https://lumocalc.com/assets/LumoCalc%20Favicon.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Debt-to-Income (DTI) Calculator | LumoCalc" />
  <meta name="twitter:description" content="Calculate your DTI ratio and see how lenders rate your debt compared to your income." />

  <link rel="icon" href="../assets/LumoCalc%20Favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div id="site-header"></div>
<main class="container">
  <section class="hero">
    <h1 class="h1">Debt-to-Income (DTI) Calculator</h1>
    <p class="lede">See how much of your income goes toward monthly debt payments.</p>
  </section>

  <section class="card">
    <form class="form" id="form">
      <div class="row">
        <div class="field">
          <label for="income">Monthly gross income</label>
          <input id="income" inputmode="decimal" placeholder="e.g., 5200" />
        </div>
        <div class="field">
          <label for="debt">Total monthly debt payments</label>
          <input id="debt" inputmode="decimal" placeholder="e.g., 1450" />
        </div>
      </div>

      <div class="row">
        <button class="btn btn--primary">Calculate</button>
        <button class="btn" type="button" id="reset">Reset</button>
      </div>

      <div id="err" class="error"></div>

      <div class="result" id="out" hidden>
        <strong id="dti">—</strong>
        <div class="small" id="rating"></div>
        <div class="small" id="details"></div>
      </div>
    </form>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="../js/calc-dti.js"></script>
<script src="../js/includes.js"></script>

</script>
</body>
</html>
