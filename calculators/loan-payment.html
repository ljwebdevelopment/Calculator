<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loan Payment Calculator | LumoCalc</title>
  <meta name="description" content="Calculate your monthly loan payment from amount, APR, and term. See total interest paid and payoff impact of extra payments." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://lumocalc.com/calculators/loan-payment.html" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lumocalc.com/calculators/loan-payment.html" />
  <meta property="og:site_name" content="LumoCalc" />
  <meta property="og:title" content="Loan Payment Calculator | LumoCalc" />
  <meta property="og:description" content="Calculate monthly loan payments from amount, APR, and term. See total interest and savings from extra payments." />
  <meta property="og:image" content="https://lumocalc.com/assets/LumoCalc%20Favicon.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Loan Payment Calculator | LumoCalc" />
  <meta name="twitter:description" content="Calculate monthly loan payments from amount, APR, and term." />

  <link rel="icon" href="../assets/LumoCalc%20Favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
 <div id="site-header"></div>
  <main class="container">
    <section class="hero">
      <h1 class="h1">Loan Payment Calculator</h1>
      <p class="lede">Estimate your monthly payment (principal + interest) for a standard amortized loan.</p>
    </section>

    <section class="card">
      <form class="form" id="form" novalidate>
        <div class="row">
          <div class="field">
            <label for="amount">Loan amount</label>
            <input id="amount" inputmode="decimal" placeholder="e.g., 15000" />
          </div>
          <div class="field">
            <label for="apr">APR (%)</label>
            <input id="apr" inputmode="decimal" placeholder="e.g., 6.9" />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="years">Term (years)</label>
            <input id="years" inputmode="decimal" value="5" />
          </div>
          <div class="field">
            <label for="extra">Extra monthly payment (optional)</label>
            <input id="extra" inputmode="decimal" value="0" />
          </div>
        </div>

        <div class="row">
          <button class="btn btn--primary" type="submit">Calculate</button>
          <button class="btn" type="button" id="reset">Reset</button>
        </div>

        <div id="err" class="error" role="alert" aria-live="polite"></div>

        <div class="result" id="out" hidden>
          <strong id="payment">$0.00 / month</strong>
          <div class="small" id="summary"></div>
          <div class="small" id="summary2"></div>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Notes</h2>
      <p class="small">
        This calculator assumes a fixed APR and regular monthly payments. It estimates payoff impact if you add an extra amount monthly.
      </p>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="../js/calc-loan.js"></script>
  <script src="../js/includes.js"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Loan Payment Calculator",
    "applicationCategory": "FinanceApplication",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "operatingSystem": "All",
    "url": "https://lumocalc.com/calculators/loan-payment.html"
  }
  </script>
</body>
</html>
