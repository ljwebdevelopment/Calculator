<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Net Worth Calculator | LumoCalc</title>
  <meta name="description" content="Calculate your net worth by adding assets (cash, home, investments) and liabilities (loans, cards). Results are instant and auto-saved in your browser." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://lumocalc.com/calculators/net-worth.html" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lumocalc.com/calculators/net-worth.html" />
  <meta property="og:site_name" content="LumoCalc" />
  <meta property="og:title" content="Net Worth Calculator | LumoCalc" />
  <meta property="og:description" content="Add assets and liabilities to calculate your net worth instantly. Auto-saved in your browser." />
  <meta property="og:image" content="https://lumocalc.com/assets/LumoCalc%20Favicon.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Net Worth Calculator | LumoCalc" />
  <meta name="twitter:description" content="Add assets and liabilities to calculate your net worth instantly. Auto-saved in your browser." />

  <link rel="icon" href="../assets/LumoCalc%20Favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <section class="hero">
      <h1 class="h1">Net Worth Calculator</h1>
      <p class="lede">Add your assets and liabilities to see your net worth instantly. Saved in your browser.</p>
    </section>

    <section class="card">
      <div class="row">
        <button class="btn btn--primary" type="button" id="addAsset">Add Asset</button>
        <button class="btn btn--primary" type="button" id="addLiability">Add Liability</button>
        <button class="btn" type="button" id="reset">Reset</button>
      </div>

      <div id="err" class="error" role="alert" aria-live="polite"></div>

      <div class="grid" style="margin-top:14px;">
        <div class="card" style="grid-column: span 6;">
          <h2>Assets</h2>
          <p class="small">Cash, checking/savings, home value, cars, investments, retirement, etc.</p>
          <div id="assets"></div>
        </div>

        <div class="card" style="grid-column: span 6;">
          <h2>Liabilities</h2>
          <p class="small">Mortgage, auto loans, student loans, credit cards, personal loans, etc.</p>
          <div id="liabilities"></div>
        </div>
      </div>

      <div class="result" style="margin-top:14px;">
        <strong id="net">Net worth: $0.00</strong>
        <div class="small" id="totals"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="../js/calc-net-worth.js"></script>
  <script src="../js/includes.js"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Net Worth Calculator",
    "applicationCategory": "FinanceApplication",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "operatingSystem": "All",
    "url": "https://lumocalc.com/calculators/net-worth.html"
  }
  </script>
</body>
</html>
