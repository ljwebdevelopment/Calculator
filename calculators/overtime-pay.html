<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overtime Pay Calculator | LumoCalc</title>
  <meta name="description" content="Calculate weekly gross pay including overtime. Set your hourly rate, total hours, overtime threshold, and multiplier (default 1.5×). Free, no sign-up." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://lumocalc.com/calculators/overtime-pay.html" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lumocalc.com/calculators/overtime-pay.html" />
  <meta property="og:site_name" content="LumoCalc" />
  <meta property="og:title" content="Overtime Pay Calculator | LumoCalc" />
  <meta property="og:description" content="Calculate weekly gross pay including overtime (time-and-a-half). Set custom threshold and multiplier." />
  <meta property="og:image" content="https://lumocalc.com/assets/LumoCalc%20Favicon.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Overtime Pay Calculator | LumoCalc" />
  <meta name="twitter:description" content="Calculate weekly gross pay including overtime (time-and-a-half)." />

  <link rel="icon" href="../assets/LumoCalc%20Favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <section class="hero">
      <h1 class="h1">Overtime Pay Calculator</h1>
      <p class="lede">Estimate weekly gross pay with overtime (default: over 40 hours at 1.5×).</p>
    </section>

    <section class="card">
      <form class="form" id="form" novalidate>
        <div class="row">
          <div class="field">
            <label for="rate">Hourly rate</label>
            <input id="rate" inputmode="decimal" placeholder="e.g., 18.50" />
          </div>
          <div class="field">
            <label for="hours">Total hours worked (week)</label>
            <input id="hours" inputmode="decimal" placeholder="e.g., 46" />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="threshold">Overtime starts after</label>
            <input id="threshold" inputmode="decimal" value="40" />
          </div>
          <div class="field">
            <label for="mult">Overtime multiplier</label>
            <input id="mult" inputmode="decimal" value="1.5" />
          </div>
        </div>

        <div class="row">
          <button class="btn btn--primary" type="submit">Calculate</button>
          <button class="btn" type="button" id="reset">Reset</button>
        </div>

        <div id="err" class="error" role="alert" aria-live="polite"></div>

        <div class="result" id="out" hidden>
          <strong id="gross">$0.00</strong>
          <div class="small" id="breakdown"></div>
        </div>
      </form>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="../js/calc-overtime.js"></script>
  <script src="../js/includes.js"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Overtime Pay Calculator",
    "applicationCategory": "FinanceApplication",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "operatingSystem": "All",
    "url": "https://lumocalc.com/calculators/overtime-pay.html"
  }
  </script>
</body>
</html>
