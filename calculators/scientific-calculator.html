<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scientific Calculator | LumoCalc</title>
  <meta name="description" content="Free scientific calculator with trig (sin, cos, tan), logs, powers, roots, and parentheses. Safe expression parser, no sign-up needed." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://lumocalc.com/calculators/scientific-calculator.html" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lumocalc.com/calculators/scientific-calculator.html" />
  <meta property="og:site_name" content="LumoCalc" />
  <meta property="og:title" content="Scientific Calculator | LumoCalc" />
  <meta property="og:description" content="Free scientific calculator with trig, logs, powers, roots, and parentheses. Safe expression parser." />
  <meta property="og:image" content="https://lumocalc.com/assets/LumoCalc%20Favicon.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Scientific Calculator | LumoCalc" />
  <meta name="twitter:description" content="Free scientific calculator with trig, logs, powers, roots, and parentheses." />

  <link rel="icon" type="image/png" href="../assets/LumoCalc%20Favicon.png">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="theme-green">
  <div id="site-header"></div>
  <main class="container">
    <section class="hero">
      <h1 class="h1">Scientific Calculator</h1>
      <p class="lede">Type an expression or use buttons. Trig uses degrees.</p>
    </section>

    <section class="card" style="max-width:720px; margin:0 auto;">
      <div class="field">
        <label for="expr">Expression</label>
        <input id="expr" placeholder="e.g., sin(30) + 2^3 + sqrt(16) + log(100)" />
      </div>

      <div class="row" style="margin-top:12px;">
        <button class="btn" type="button" data-ins="sin(">sin</button>
        <button class="btn" type="button" data-ins="cos(">cos</button>
        <button class="btn" type="button" data-ins="tan(">tan</button>
        <button class="btn" type="button" data-ins="sqrt(">sqrt</button>
      </div>

      <div class="row">
        <button class="btn" type="button" data-ins="ln(">ln</button>
        <button class="btn" type="button" data-ins="log(">log</button>
        <button class="btn" type="button" data-ins="pi">pi</button>
        <button class="btn" type="button" data-ins="e">e</button>
      </div>

      <div class="row">
        <button class="btn" type="button" data-ins="(">(</button>
        <button class="btn" type="button" data-ins=")">)</button>
        <button class="btn" type="button" data-ins="^">^</button>
        <button class="btn" type="button" id="clear">Clear</button>
      </div>

      <div class="row">
        <button class="btn btn--primary" type="button" id="calc" style="grid-column:span 2;">Calculate</button>
      </div>

      <div id="err" class="error" role="alert" aria-live="polite"></div>
      <div class="result" id="out" hidden>
        <strong id="ans">—</strong>
        <div class="small">Supported: + − × ÷ ^ ( ) sin cos tan sqrt ln log, constants pi, e</div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="../js/calc-scientific.js"></script>
  <script src="../js/includes.js"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Scientific Calculator",
    "applicationCategory": "EducationApplication",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "operatingSystem": "All",
    "url": "https://lumocalc.com/calculators/scientific-calculator.html"
  }
  </script>
</body>
</html>
